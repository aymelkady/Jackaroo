services:
  - type: web
    name: jackaroo
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /data
    disk:
      name: jackaroo-data
      mountPath: /data
      sizeGB: 1
