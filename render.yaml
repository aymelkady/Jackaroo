# Render Blueprint: free web service. Click "New +" -> "Blueprint" in Render, pick this repo, Apply.
# Games are kept in memory and on the instance's disk; the free plan wipes that disk when the
# service spins down after ~15 min without traffic. Add the two Upstash variables (free Redis)
# and games survive restarts and deploys.
services:
  - type: web
    name: jackaroo
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
