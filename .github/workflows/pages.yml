name: Publish to GitHub Pages
# Builds the static (serverless) site and pushes it to the gh-pages branch, which GitHub Pages serves
# at https://aymelkady.github.io/Jackaroo/ . Runs on every push to any branch except gh-pages itself.
on:
  push:
    branches-ignore: ["gh-pages"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: sh scripts/build-pages.sh
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish site from ${{ github.sha }}"
